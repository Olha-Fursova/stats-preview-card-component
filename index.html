<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stats-preview-card-component</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./src/css/styles.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="cta-heading">Visit my Portfolio Web-site</h1>
      <a
        class="site-link btn-more"
        href="https://solvixcode.com/"
        target="_blank"
        rel="noopener noreferrer"
        >SolvixCode</a
      >
    </header>

    <main class="main">
      <picture class="image-container">
        <img
          class="main-image"
          src="/main-image-1x.png"
          srcset="/main-image-1x.png 1x, /main-image-2x.png 2x"
          alt="Three women are sitting behind an office table"
        />
      </picture>
      <section class="info-section">
        <h2 class="main-heading">
          Get <span class="highlight">insights</span> that help your business
          grow.
        </h2>
        <article class="intro-text">
          Discover the benefits of data analytics and make better decisions
          regarding revenue, customer experience, and overall efficiency.
        </article>
      </section>

      <ul class="stats-list">
        <li class="stats-element">
          <h2 class="stats-number">10k+</h2>
          <p class="stats-category">Companies</p>
        </li>
        <li class="stats-element">
          <h2 class="stats-number">314</h2>
          <p class="stats-category">Templates</p>
        </li>
        <li class="stats-element">
          <h2 class="stats-number">12M+</h2>
          <p class="stats-category">Queries</p>
        </li>
      </ul>
    </main>
  </body>
</html>
